<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trò Chơi Ô Chữ - Vật Lý</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Animated blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="noise"></div>

    <!-- ===== WELCOME SCREEN ===== -->
    <div class="welcome-screen" id="welcome-screen">
      <div class="welcome-content">
        <div class="welcome-badge">VẬT LÝ</div>
        <h1 class="welcome-title">
          <span class="wt-line1">TRÒ CHƠI</span>
          <span class="wt-line2">Ô CHỮ</span>
        </h1>
        <p class="welcome-sub">Khám phá thế giới Vật Lý qua những câu đố thú vị</p>
        <button type="button" class="btn-start" id="btn-start">
          <span class="btn-start-icon">▶</span>
          BẮT ĐẦU
        </button>
        <div class="welcome-deco">
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <span class="wd-gap"></span>
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="app">
      <!-- Title -->
      <header class="header">
        <div class="header-line"></div>
        <h1>TRÒ CHƠI Ô CHỮ</h1>
        <div class="header-line"></div>
      </header>

      <!-- Main -->
      <div class="main">
        
        <!-- Left Column: Question & Timer -->
        <div class="left-col">
        <div class="card q-card" id="q-card">
          <div class="q-top">
            <div class="q-badge" id="q-badge">
              <span id="q-num">?</span>
            </div>
            <div class="q-tag">CÂU HỎI</div>
          </div>
          <div class="q-content">
            <div class="q-left">
              <p class="q-text" id="q-text">
                Nhấn vào một hàng ngang để xem câu hỏi
              </p>
              <div class="q-btns hidden" id="q-btns">
                <button
                  type="button"
                  class="btn btn-gold"
                  id="btn-back"
                  title="Quay lại"
                  aria-label="Quay lại"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                  >
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                  </svg>
                </button>
                <button
                  type="button"
                  class="btn btn-red"
                  id="btn-sai"
                  aria-label="Sai"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"
                  >
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                  </svg>
                </button>
                <button
                  type="button"
                  class="btn btn-green"
                  id="btn-dung"
                  aria-label="Đúng"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </button>
              </div>
            </div>
            <!-- Hộp ĐÁP ÁN (hiển thị text to đùng) -->
            <div class="q-ans-box hidden" id="q-ans-box">
              <div class="q-ans-title">ĐÁP ÁN</div>
              <div class="q-ans-text" id="q-ans-text">...</div>
            </div>
          </div>
        </div>

        <!-- Timer Widget chuyển xuống dưới Câu hỏi -->
        <div class="timer-widget hidden" id="timer-widget">
          <div class="timer-circle" id="q-timer">20</div>
          <button type="button" class="btn btn-blue" id="btn-start-timer" aria-label="Bắt đầu đếm">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            BẮT ĐẦU ĐẾM
          </button>
          <div class="timeout-alert hidden" id="timeout-alert">HẾT THỜI GIAN!</div>
        </div>
      </div> <!-- End Left Column -->

      <!-- Right: Grid -->
      <div class="card grid-card" id="grid-card">
          <div class="gc-left">
            <div class="grid" id="grid"></div>
          </div>
          <div class="gc-right">
            <div class="q-diagram hidden" id="q-diagram"></div>
          </div>
        </div>
      </div>

      <!-- Keyword -->
      <div class="card kw-card">
        <div class="kw-label">🔑 TỪ KHÓA BÍ MẬT</div>
        <div class="kw-row" id="kw-all"></div>
        <div class="kw-actions">
          <button type="button" class="btn btn-gold" id="btn-kw">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            Mở từ khoá
          </button>
          <button type="button" class="btn btn-red hidden" id="btn-kw-cancel" title="Ẩn lại từ khoá" aria-label="Ẩn lại từ khoá">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            >
              <line x1="19" y1="12" x2="5" y2="12" />
              <polyline points="12 19 5 12 12 5" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Flash wrong -->
    <div id="fx-wrong" class="fx hidden">
      <div class="fx-content">
        <div class="fx-circle fx-red">✕</div>
        <h1 class="fx-h1 fx-h1-red">SAI RỒI!</h1>
      </div>
    </div>
    <!-- Flash correct -->
    <div id="fx-correct" class="fx hidden">
      <div class="fx-content">
        <div class="fx-circle fx-green">✓</div>
        <h1 class="fx-h1 fx-h1-green">CHÍNH XÁC!</h1>
      </div>
    </div>

    <!-- Win -->
    <div id="win" class="win-overlay hidden">
      <div class="win-modal">
        <div class="win-emoji">🏆</div>
        <h1 class="win-h1">CHÚC MỪNG!</h1>
        <h2 class="win-h2">CHUYỂN ĐỘNG TRÒN ĐỀU</h2>
        <p class="win-p">Tuyệt vời! Hoàn thành toàn bộ ô chữ!</p>
        <button type="button" class="btn btn-green" id="btn-close-win">
          Đóng
        </button>
      </div>
    </div>

    <div id="confetti"></div>
    <script src="script.js"></script>
  </body>
</html>
